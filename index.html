<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#001f35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plärrdeifl">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>Plärrdeifl Portal</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/icon-32.png">
  <link rel="apple-touch-icon" href="./assets/icons/icon-180.png">
  <link rel="stylesheet" href="./css/tokens.css?v=20260717-final-mobile-shell-r1">
  <link rel="stylesheet" href="./css/app.css?v=20260826-p800-r2-mobile-two-column-final">
  <script src="./js/runtime-config.js"></script>
</head>
<body>
  <div class="ios-fixed-backdrop" aria-hidden="true"></div>
  <div id="app" class="app-shell">
    <aside class="sidebar" data-sidebar aria-label="Hauptnavigation">
      <div class="sidebar-brand">
        <img src="./assets/icons/icon-192.png" alt="Plärrdeifl">
        <div>
          <strong>Plärrdeifl</strong>
          <span>Digitalplattform</span>
        </div>
      </div>
      <nav class="sidebar-nav" data-sidebar-nav></nav>
      <div class="sidebar-footer" data-sidebar-footer></div>
    </aside>

    <div class="shell-main">
      <header class="topbar">
        <button class="icon-button menu-button" type="button" data-sidebar-toggle aria-label="Navigation öffnen">☰</button>
        <div class="topbar-title">
          <strong data-page-title>Plärrdeifl</strong>
          <span data-page-subtitle>Digitalplattform</span>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" type="button" data-notification-button aria-label="Benachrichtigungen">
            <span aria-hidden="true">🔔</span>
            <span class="notification-dot" data-notification-dot hidden></span>
          </button>
          <button class="avatar-button" type="button" data-profile-button aria-label="Profil öffnen">
            <span data-profile-initials>PD</span>
          </button>
        </div>
      </header>

      <main id="main" class="main-content" tabindex="-1"></main>
    </div>

    <nav class="bottom-nav" data-bottom-nav aria-label="Mobile Navigation"></nav>
  </div>

  <div class="sidebar-scrim" data-sidebar-scrim></div>

  <dialog id="v4Dialog" class="v4-dialog">
    <div class="v4-dialog-card">
      <header class="v4-dialog-header">
        <div>
          <span class="v4-dialog-kicker" data-v4-dialog-kicker></span>
          <h2 data-v4-dialog-title></h2>
        </div>
        <button class="icon-button" type="button" data-v4-dialog-close aria-label="Dialog schließen">×</button>
      </header>
      <div class="v4-dialog-body" data-v4-dialog-body></div>
    </div>
  </dialog>

  <dialog id="v4ConfirmDialog" class="v4-dialog confirm-dialog">
    <form method="dialog" class="v4-dialog-card">
      <header class="v4-dialog-header">
        <div>
          <span class="v4-dialog-kicker">Bestätigung</span>
          <h2 data-v4-confirm-title>Aktion bestätigen</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="Dialog schließen">×</button>
      </header>
      <div class="v4-dialog-body">
        <p data-v4-confirm-message></p>
        <div class="dialog-actions">
          <button class="button secondary" value="cancel">Abbrechen</button>
          <button class="button primary" value="confirm" data-v4-confirm-submit>Bestätigen</button>
        </div>
      </div>
    </form>
  </dialog>

  <section id="authGate" class="auth-gate" hidden>
    <div class="auth-card">
      <img src="./assets/icons/icon-192.png" alt="Plärrdeifl">
      <h1>Plärrdeifl Portal</h1>
      <p>Melde dich an, um die Digitalplattform zu nutzen.</p>
      <div data-auth-gate-content></div>
    </div>
  </section>

  <section id="authGateMaintenance" class="auth-gate" hidden>
    <div class="auth-card">
      <img src="./assets/icons/icon-192.png" alt="Plärrdeifl">
      <h1 id="authGateMaintenanceTitle">Wartungsmodus</h1>
      <p data-auth-gate-maintenance-message>Die Plattform ist vorübergehend nicht verfügbar.</p>
    </div>
  </section>

  <script type="module" src="./js/task-push-r3.js?v=20260802-pwa-install-guidance-r1"></script>

  <script type="module" src="./js/app.js?v=20260802-pwa-install-guidance-r1"></script>
  <script type="module" src="./js/p800-r2-fanbus-ux.js?v=20260826-p800-r2-mobile-two-column-final"></script>
  <script type="module" src="./js/modules/m320-r3-auto-assignment.js?v=20260827-m320-r3-r1"></script>
  <script type="module" src="./js/m326-person-picker-ux.js?v=20260827-m326-mobile-picker-r5"></script>
</body>
</html>
