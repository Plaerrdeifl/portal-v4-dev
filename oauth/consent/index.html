<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#041c33">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex,nofollow">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src https://accounts.google.com https://*.supabase.co; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://accounts.google.com; script-src 'self' https://cdn.jsdelivr.net https://accounts.google.com; connect-src 'self' https://*.supabase.co https://accounts.google.com wss://*.supabase.co; worker-src 'self'; form-action 'self' https://accounts.google.com https://*.supabase.co"
  >
  <title>Nextcloud verbinden – Plärrdeifl Portal</title>
  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/assets/icons/icon-32.png"
  >
  <link
    rel="stylesheet"
    href="/css/tokens.css?v=20260802-pwa-install-guidance-r1"
  >
  <link
    rel="stylesheet"
    href="/css/app.css?v=20260802-pwa-install-guidance-r1&m340=20260908-social-media-generator-r1"
  >
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7fb;
      color: #102a43;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .oauth-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .oauth-card {
      width: min(100%, 520px);
      background: #fff;
      border-radius: 24px;
      padding: 28px;
      box-sizing: border-box;
      box-shadow: 0 18px 50px rgba(4, 28, 51, 0.14);
    }

    .oauth-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .oauth-brand img {
      width: 58px;
      height: 58px;
      object-fit: contain;
    }

    .oauth-brand strong {
      display: block;
      font-size: 1.15rem;
    }

    .oauth-brand span {
      color: #627d98;
      font-size: 0.9rem;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.5rem, 5vw, 2rem);
      color: #041c33;
    }

    .oauth-lead {
      margin: 0 0 22px;
      line-height: 1.5;
      color: #486581;
    }

    .oauth-details {
      margin: 18px 0;
      padding: 16px;
      border-radius: 16px;
      background: #f0f5fa;
    }

    .oauth-details p {
      margin: 0 0 8px;
    }

    .oauth-details p:last-child {
      margin-bottom: 0;
    }

    .oauth-actions {
      display: flex;
      gap: 12px;
      margin-top: 22px;
    }

    .oauth-actions button {
      flex: 1;
      min-height: 46px;
      border-radius: 999px;
      border: 0;
      padding: 0 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .oauth-approve {
      background: #075985;
      color: #fff;
    }

    .oauth-deny {
      background: #e7edf3;
      color: #243b53;
    }

    .oauth-status {
      margin-top: 16px;
      min-height: 24px;
      color: #486581;
      line-height: 1.45;
    }

    .oauth-status.error {
      color: #b42318;
    }

    .oauth-status.success {
      color: #067647;
    }

    .oauth-login {
      margin-top: 18px;
    }

    .oauth-login .google-signin-slot {
      display: flex;
      justify-content: center;
      min-height: 44px;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <main class="oauth-shell">
    <section class="oauth-card" aria-labelledby="oauthTitle">
      <div class="oauth-brand">
        <img src="/assets/icons/icon-180.png" alt="">
        <div>
          <strong>Schweinfurter Plärrdeifl</strong>
          <span>Portal → Nextcloud</span>
        </div>
      </div>

      <h1 id="oauthTitle">Nextcloud verbinden</h1>
      <p id="oauthLead" class="oauth-lead">
        Prüfe deinen Portalzugang, um Nextcloud mit deinem Plärrdeifl-Konto zu verbinden.
      </p>

      <div id="loginPanel" class="oauth-login" hidden>
        <div
          id="googleSignInButton"
          class="google-signin-slot"
          aria-label="Mit Google anmelden"
          aria-live="polite"
        ></div>
      </div>

      <div id="consentPanel" hidden>
        <div class="oauth-details">
          <p>
            <strong id="clientName">Nextcloud</strong> möchte deinen
            Plärrdeifl-Account zur Anmeldung verwenden.
          </p>
          <p id="scopeText"></p>
        </div>

        <div class="oauth-actions">
          <button
            id="approveButton"
            class="oauth-approve"
            type="button"
          >
            Verbinden
          </button>
          <button
            id="denyButton"
            class="oauth-deny"
            type="button"
          >
            Abbrechen
          </button>
        </div>
      </div>

      <p id="oauthStatus" class="oauth-status" role="status" aria-live="polite">
        Portalzugang wird geprüft …
      </p>
    </section>
  </main>

  <script src="/js/runtime-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="/oauth/consent/consent.js"></script>
</body>
</html>
