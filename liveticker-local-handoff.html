<!doctype html>
<html lang="de" data-environment="DEV">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src https://accounts.google.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://accounts.google.com; script-src 'self' https://cdn.jsdelivr.net https://accounts.google.com; connect-src 'self' https://*.supabase.co https://accounts.google.com wss://*.supabase.co"
  >
  <title>Lokalen Liveticker öffnen · DEV</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #080808; color: #f4f4f4; }
    main { width: min(100%, 560px); padding: 28px; border: 1px solid #343434; border-radius: 22px; background: #151515; }
    .eyebrow { margin: 0 0 8px; color: #a8a8a8; font-size: .85rem; }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 8vw, 3rem); }
    p { line-height: 1.5; }
    .status { min-height: 3em; padding-top: 16px; border-top: 1px solid #303030; color: #cfcfcf; }
    button { width: 100%; min-height: 48px; border: 0; border-radius: 999px; padding: 10px 18px; font: inherit; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #googleSlot { min-height: 48px; display: grid; place-items: center; margin: 18px 0; }
    #openButton { margin: 18px 0; }
    a { color: #a8d3f5; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Plärrdeifl DEV</p>
    <h1>Lokalen Liveticker öffnen</h1>
    <p>
      Die Anmeldung läuft über das bestehende DEV-Portal. Danach wird deine
      DEV-Supabase-Sitzung direkt im Browser an den lokalen Liveticker übergeben.
    </p>

    <div id="googleSlot" hidden></div>

    <button id="openButton" type="button" hidden>
      Lokalen Liveticker öffnen
    </button>

    <p id="status" class="status" role="status">
      Portalsitzung wird geprüft …
    </p>

    <p>
      <a href="./">Zurück zum DEV-Portal</a>
    </p>
  </main>

  <script src="./js/runtime-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.7"></script>
  <script type="module" src="./js/liveticker-local-handoff.js"></script>
</body>
</html>
