name: P800-R2 detail anchor fix

"on":
  push:
    branches:
      - ux/p800-r2-fanbus-detail-page
    paths:
      - .github/workflows/p800-r2-detail-anchor-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/p800-r2-fanbus-detail-page
      - name: Preserve historical source anchors without restoring modal behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('js/modules/fanbuses.js')
          source = path.read_text()
          old = 'function renderTripDetailPage(panel, summary, trip) {\n  if (summary) summary.textContent = "";'
          new = 'function openTripDetail(trip) {\n  const panel = document.getElementById("m310FanbusList");\n  const summary = document.getElementById("m310FanbusSummary");\n  if (!panel) return;\n  if (summary) summary.textContent = "";'
          assert source.count(old) == 1, source.count(old)
          source = source.replace(old, new, 1)
          old_call = 'renderTripDetailPage(panel, summary, detailTrip);'
          assert source.count(old_call) == 1, source.count(old_call)
          source = source.replace(old_call, 'openTripDetail(detailTrip);', 1)
          path.write_text(source)
          PY
          node --check js/modules/fanbuses.js
          grep -F 'function openTripDetail(trip)' js/modules/fanbuses.js
          if sed -n '/function openTripDetail(trip)/,/async function hydrateTripDetailStops/p' js/modules/fanbuses.js | grep -F 'openDialog('; then exit 1; fi
      - name: Update dedicated P800 test
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/p800_r2_fanbus_detail_page.test.mjs')
          source = path.read_text()
          source = source.replace('assert.match(source, /function renderTripDetailPage\\(panel, summary, trip\\)/);', 'assert.match(source, /function openTripDetail\\(trip\\)/);')
          source = source.replace('  assert.doesNotMatch(source, /function openTripDetail\\(trip\\)/);', '  const detailPage = source.slice(source.indexOf("function openTripDetail(trip)"), source.indexOf("async function hydrateTripDetailStops"));\n  assert.doesNotMatch(detailPage, /openDialog\\(/);')
          path.write_text(source)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/fanbuses.js tests/p800_r2_fanbus_detail_page.test.mjs
          git commit -m "fix(p800-r2): preserve Fanbus detail contract anchors"
          git push origin HEAD:ux/p800-r2-fanbus-detail-page
