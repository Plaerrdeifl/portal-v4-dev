name: Remove obsolete Vercel configuration

"on":
  push:
    branches:
      - chore/remove-vercel
    paths:
      - .github/workflows/remove-vercel-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/remove-vercel

      - name: Remove Vercel config and replace deployment contract
        run: |
          echo '' | base64 -d > /tmp/remove_vercel.py
          python /tmp/remove_vercel.py
          rm -f vercel.json
          rm -f .github/workflows/audit-vercel-references.yml
          rm -f .github/workflows/remove-vercel-cleanup.yml

      - name: Verify cleanup
        run: |
          test ! -e vercel.json
          grep -F 'Cloudflare Pages DEV deployment publishes only the static build' tests/core_contract.test.mjs
          grep -F 'Vercel gehört nicht zu diesem Projekt' AGENTS.md
          if grep -RIn -i --exclude-dir=.git --exclude='AGENTS.md' 'vercel' .; then
            echo 'Unexpected Vercel reference remains.'
            exit 1
          fi
          node --check tests/core_contract.test.mjs

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove obsolete Vercel configuration"
          git push origin HEAD:chore/remove-vercel
