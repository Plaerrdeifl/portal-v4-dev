name: P800-R2 Fanbus detail page patch

"on":
  push:
    branches:
      - ux/p800-r2-fanbus-detail-page
    paths:
      - .github/workflows/p800-r2-fanbus-detail-page-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ux/p800-r2-fanbus-detail-page

      - name: Replace modal trip detail with routed page
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'js/modules/fanbuses.js';
          let source = fs.readFileSync(file, 'utf8');
          const decode = value => Buffer.from(value, 'base64').toString('utf8');
          const replaceOnce = (before64, after64, label) => {
            const before = decode(before64);
            const after = decode(after64);
            const index = source.indexOf(before);
            if (index < 0) throw new Error(`${label}: source block not found`);
            if (source.indexOf(before, index + before.length) >= 0) throw new Error(`${label}: source block not unique`);
            source = source.slice(0, index) + after + source.slice(index + before.length);
          };
          replaceOnce('', '', 'trip detail surface');
          replaceOnce('ICAgICAgcmVuZGVyKCk7CiAgICAgIGNvbnN0IHVwZGF0ZWQgPSB0cmlwcygpLmZpbmQoaXRlbSA9PiBpdGVtLmlkID09PSB0cmlwLmlkKTsKICAgICAgaWYgKHVwZGF0ZWQpIHJlc3RvcmVUcmlwT3ZlcnZpZXcoZGlhbG9nLCB1cGRhdGVkKTsKICAgICAgZWxzZSBkaWFsb2cuY2xvc2UoKTs=', '', 'inline editor rerender');
          replaceOnce('ICB9CgogIHNldFdvcmtzcGFjZVNoZWxsKGZhbHNlKTsKCiAgY29uc3QgaXRlbXMgPSB0cmlwcygpOwogIGNvbnN0IGNhbk1hbmFnZSA9IGhhc0NhcGFiaWxpdHkoImZhbmJ1cy5tYW5hZ2UiKTs=', '', 'detail route render');
          replaceOnce('ICAgICAgY29uc3QgdHJpcCA9IGl0ZW1zLmZpbmQoaXRlbSA9PiBpdGVtLmlkID09PSByZWNvcmQuZGF0YXNldC5tMzEwT3BlblRyaXApOwogICAgICBpZiAodHJpcCkgb3BlblRyaXBEZXRhaWwodHJpcCk7', 'ICAgICAgY29uc3QgdHJpcCA9IGl0ZW1zLmZpbmQoaXRlbSA9PiBpdGVtLmlkID09PSByZWNvcmQuZGF0YXNldC5tMzEwT3BlblRyaXApOwogICAgICBpZiAodHJpcCkgewogICAgICAgIHdpbmRvdy5sb2NhdGlvbi5oYXNoID0gYCMvZmFuYnVzZXM/ZGV0YWlsPSR7ZW5jb2RlVVJJQ29tcG9uZW50KHRyaXAuaWQpfWA7CiAgICAgIH0=', 'trip click route');
          replaceOnce('ICBjb25zdCBkZXRhaWxUcmlwID0gaXRlbXMuZmluZChpdGVtID0+IGl0ZW0uaWQgPT09IHJvdXRlUXVlcnkuZ2V0KCJkZXRhaWwiKSk7CiAgaWYgKGRldGFpbFRyaXApIHsKICAgIHdpbmRvdy5oaXN0b3J5LnJlcGxhY2VTdGF0ZShudWxsLCAiIiwgIiMvZmFuYnVzZXMiKTsKICAgIG9wZW5UcmlwRGV0YWlsKGRldGFpbFRyaXApOwogIH0K', '', 'old modal deep link');
          fs.writeFileSync(file, source);
          NODE

      - name: Verify detail page contract
        run: |
          node --check js/modules/fanbuses.js
          grep -F 'function renderTripDetailPage(panel, summary, trip)' js/modules/fanbuses.js
          grep -F 'data-m310-trip-page' js/modules/fanbuses.js
          grep -F 'window.location.hash = `#/fanbuses?detail=${encodeURIComponent(trip.id)}`;' js/modules/fanbuses.js
          if grep -F 'function openTripDetail(trip)' js/modules/fanbuses.js; then exit 1; fi

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/fanbuses.js
          git commit -m "fix(p800-r2): open Fanbus trips as detail pages"
          git push origin HEAD:ux/p800-r2-fanbus-detail-page
