name: Build F2.14 WordPress packages

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact RC plugin blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object wordpress/plugins/plaerrdeifl-m150-membership/plaerrdeifl-m150-membership.php)" = "fe92ba58a2e83fd02d43c6a2088122cb0a0d1c97"
          test "$(git hash-object wordpress/plugins/plaerrdeifl-m150-membership/assets/m150-membership-admin.js)" = "f8411d58cfc196331989fc603e9771329c18d79e"
          test "$(git hash-object wordpress/plugins/plaerrdeifl-m150-membership/assets/m150-membership.css)" = "58d7855d22b78ae0b8d027dcc047a7082d852d07"
          test "$(git hash-object wordpress/plugins/plaerrdeifl-m150-membership/assets/m150-membership.js)" = "7f7c620a468e6396fb9839c84ce737cba021c1be"
          test "$(git hash-object wordpress/plugins/plaerrdeifl-m310-fanbus/plaerrdeifl-m310-fanbus.php)" = "e05cf70114eb883fce6e937d43d09d820281918e"
          test "$(git hash-object wordpress/plugins/plaerrdeifl-m310-fanbus/assets/m310-fanbus.css)" = "a89a73d2b82d4c4ccc8bcf724552433293cde357"

      - name: Build plugin ZIPs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd wordpress/plugins
          zip -X -qr ../../dist/plaerrdeifl-m150-membership-prod-r4.zip plaerrdeifl-m150-membership
          zip -X -qr ../../dist/plaerrdeifl-m310-fanbus-prod-r4.zip plaerrdeifl-m310-fanbus
          cd ../..
          sha256sum dist/*.zip > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: prod-r4-wordpress-plugins
          path: |
            dist/plaerrdeifl-m150-membership-prod-r4.zip
            dist/plaerrdeifl-m310-fanbus-prod-r4.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
