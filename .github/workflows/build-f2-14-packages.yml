name: Build F2.14 WordPress packages

on:
  push:
    branches:
      - release/prod-r4-f2-14-packages
    paths:
      - .github/workflows/build-f2-14-packages.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/prod-r4-f2-14-packages
          fetch-depth: 1

      - name: Verify RC source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "edc230a923acac68e38efd7df1b5fbd89a0c05f4"
          grep -q "Version: 1.0.5" wordpress/plugins/plaerrdeifl-m150-membership/plaerrdeifl-m150-membership.php
          grep -q "Version: 1.0.5" wordpress/plugins/plaerrdeifl-m310-fanbus/plaerrdeifl-m310-fanbus.php

      - name: Build plugin ZIPs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cd wordpress/plugins
          zip -X -qr ../../dist/plaerrdeifl-m150-membership-prod-r4.zip plaerrdeifl-m150-membership
          zip -X -qr ../../dist/plaerrdeifl-m310-fanbus-prod-r4.zip plaerrdeifl-m310-fanbus
          cd ../..
          sha256sum dist/*.zip > dist/SHA256SUMS.txt

      - name: Commit packages to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Plärrdeifl Release Automation"
          git config user.email "release@plaerrdeifl.de"
          git add dist/plaerrdeifl-m150-membership-prod-r4.zip dist/plaerrdeifl-m310-fanbus-prod-r4.zip dist/SHA256SUMS.txt
          git commit -m "chore(release): publish F2.14 WordPress packages"
          git push origin HEAD:release/prod-r4-f2-14-packages
