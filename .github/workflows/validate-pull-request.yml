name: Validate portal pull request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build DEV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npm test

      - name: Build exact DEV portal
        env:
          PORTAL_ENVIRONMENT: DEV
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_EXPECTED_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: npm run build

      - name: Verify DEV output
        shell: bash
        run: |
          test -s dist/index.html
          test -s dist/js/runtime-config.js
          test -s dist/service-worker.js
          test -s dist/manifest.webmanifest
          grep -q '"environment": "DEV"' dist/js/runtime-config.js
          grep -q 'tpieykhhawszlzsoflnl.supabase.co' dist/js/runtime-config.js