name: Retry integrated Fanbus accordion

"on":
  push:
    branches:
      - ux/p800-r2-fanbus-integrated-accordion
    paths:
      - .github/workflows/retry-p800-integrated-accordion.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/p800-r2-fanbus-integrated-accordion
      - name: Fix generated contract assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/p800-r2-integrated-accordion-patch.mjs')
          s = p.read_text()
          s = s.replace('  assert.doesNotMatch(detail, /openDialog\\\\(/);', '  assert.ok(!detail.includes("openDialog("));')
          s = s.replace('  assert.doesNotMatch(detail, /window\\\\.location\\\\.hash/);', '  assert.ok(!detail.includes("window.location.hash"));')
          p.write_text(s)
          PY
      - name: Apply patch
        run: node scripts/p800-r2-integrated-accordion-patch.mjs
      - name: Remove one-shot files
        run: |
          rm -f scripts/p800-r2-integrated-accordion-patch.mjs
          rm -f .github/workflows/apply-p800-integrated-accordion.yml
          rm -f .github/workflows/retry-p800-integrated-accordion.yml
      - name: Verify syntax
        run: |
          node --check js/modules/fanbuses.js
          node --check js/p800-r2-fanbus-ux.js
          node --check tests/p800_r2_fanbus_accordion.test.mjs
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(p800-r2): integrate Fanbus detail into trip card"
          git push origin HEAD:ux/p800-r2-fanbus-integrated-accordion