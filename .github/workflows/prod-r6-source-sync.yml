name: One-shot PROD R6 source sync

on:
  push:
    branches:
      - release/prod-r6-fanbus-boarding-stop-hotfix

permissions:
  contents: write

jobs:
  sync:
    if: "${{ github.event.head_commit.message != 'release: sync PROD R6 fanbus boarding-stop hotfix' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PROD release repository
        uses: actions/checkout@v6
        with:
          path: prod
          fetch-depth: 0

      - name: Checkout approved R6 hotfix source
        uses: actions/checkout@v6
        with:
          repository: Plaerrdeifl/portal-v4-dev
          ref: 214ba23edeb54c33a6c51d811c7bc822bd89fad0
          path: source
          fetch-depth: 0

      - name: Verify exact R6 plus hotfix lineage
        shell: bash
        run: |
          set -euo pipefail
          R6_SHA='59bc0b90983789ab6f78a5f13f3046e3db4db0b2'
          HOTFIX_SHA='214ba23edeb54c33a6c51d811c7bc822bd89fad0'
          test "$(git -C source rev-parse HEAD)" = "$HOTFIX_SHA"
          git -C source merge-base --is-ancestor "$R6_SHA" "$HOTFIX_SHA"
          git -C source diff --name-only "$R6_SHA" "$HOTFIX_SHA" | sort > /tmp/actual-hotfix-files.txt
          printf '%s\n' \
            'js/m327-boarding-stop-details.js' \
            'js/pages.js' \
            'tests/m327_boarding_stop_details.test.mjs' \
            | sort > /tmp/expected-hotfix-files.txt
          diff -u /tmp/expected-hotfix-files.txt /tmp/actual-hotfix-files.txt

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Re-run V4 Core quality on approved source
        shell: bash
        run: |
          set -euo pipefail
          cd source
          npm ci
          npm test
          npm run check:static
          find js scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Synchronize exact R6 hotfix source into PROD repository
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' source/ prod/
          test ! -e prod/.github/workflows/prod-r6-source-sync.yml
          test "$(git -C source rev-parse HEAD)" = '214ba23edeb54c33a6c51d811c7bc822bd89fad0'

      - name: Commit synchronized PROD source
        shell: bash
        run: |
          set -euo pipefail
          cd prod
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source differences to commit.'
            exit 0
          fi
          git commit -m 'release: sync PROD R6 fanbus boarding-stop hotfix'
          git push origin HEAD:release/prod-r6-fanbus-boarding-stop-hotfix
