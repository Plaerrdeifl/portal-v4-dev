name: Apply P800-R2 Fanbus workflow UX

"on":
  push:
    branches:
      - ux/p800-r2-fanbus-workflow
    paths:
      - .github/workflows/apply-p800-r2-fanbus-workflow.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/p800-r2-fanbus-workflow
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
      - name: Fix patch marker
        run: python scripts/fix_p800_r2_fanbus_workflow_patch.py
      - name: Apply UX patch
        run: python scripts/p800_r2_fanbus_workflow_patch.py
      - name: Preserve rights and align approved contracts
        run: python scripts/p800_r2_fanbus_workflow_followup.py
      - name: Remove one-shot files
        run: |
          rm -f scripts/p800_r2_fanbus_workflow_patch.py
          rm -f scripts/fix_p800_r2_fanbus_workflow_patch.py
          rm -f scripts/p800_r2_fanbus_workflow_followup.py
          rm -f .github/workflows/apply-p800-r2-fanbus-workflow.yml
      - name: Install dependencies
        run: npm ci
      - name: Verify syntax
        run: |
          node --check js/modules/fanbuses.js
          node --check js/p800-r2-fanbus-ux.js
          node --check tests/p800_r2_fanbus_workflow_ux.test.mjs
      - name: Run tests
        run: npm test
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(p800-r2): redesign Fanbus trip workflow UX"
          git push origin HEAD:ux/p800-r2-fanbus-workflow
