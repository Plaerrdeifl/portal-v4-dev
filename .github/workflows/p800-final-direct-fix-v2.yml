name: P800 final Fanbus direct fix v2

on:
  push:
    branches:
      - ux/p800-r2-polish4-final-direct-fix-v2

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/p800-r2-polish4-final-direct-fix-v2
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Apply deterministic source fix
        shell: bash
        run: |
          git fetch origin ux/p800-r2-polish4-final-direct-fix
          python - <<'PY'
          import base64
          import re
          import subprocess
          from pathlib import Path

          source = subprocess.check_output([
            "git", "show", "FETCH_HEAD:.github/workflows/p800-final-direct-fix.yml"
          ], text=True)
          match = re.search(r"echo '([^']+)' \| base64 -d > /tmp/p800-fix\.py", source)
          if not match:
            raise SystemExit("could not recover deterministic fix payload")
          Path("/tmp/p800-fix.py").write_bytes(base64.b64decode(match.group(1)))
          PY
          python /tmp/p800-fix.py

      - name: Align stale regression contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new, label, expected=None):
              text = path.read_text()
              count = text.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f"{label}: expected {expected}, got {count}")
              if count:
                  path.write_text(text.replace(old, new))
              print(f"{label}: {count}")
              return count

          public_html = Path("fanbus-anmeldung.html")
          replace_required(
              public_html,
              './js/fanbus-registration.js?v=20260826-p800-r2-final-direct-fix',
              './js/fanbus-registration.js',
              'restore standalone script contract',
              1
          )

          direct = Path("tests/p800_r2_fanbus_final_direct_fix.test.mjs")
          replace_required(
              direct,
              'assert.match(publicHtml, /fanbus-registration\\.js\\?v=20260826-p800-r2-final-direct-fix/);',
              'assert.match(publicHtml, /<script type="module" src="\\.\\/js\\/fanbus-registration\\.js"><\\/script>/);',
              'direct test standalone script contract',
              1
          )

          replacements = [
              (
                  '/formatBerlinTime\\(stop\\.departureAt\\)/',
                  '/boardingStopDisplay\\(stop\\)/',
                  'internal boarding display assertion'
              ),
              (
                  '/stop\\.label} · \\$\\{formatBerlinTime\\(stop\\.departureAt\\)}/',
                  '/formatBerlinTime\\(stop\\.departureAt\\)} · \\$\\{stop\\.label}/',
                  'public boarding display assertion'
              ),
              (
                  'grid-template-columns:minmax\\(0,1fr\\) 104px auto',
                  'grid-template-columns:104px minmax\\(0,1fr\\) auto',
                  'time-first stop grid assertion'
              )
          ]

          totals = {label: 0 for _, _, label in replacements}
          for path in Path('tests').glob('*.mjs'):
              text = path.read_text()
              original = text
              for old, new, label in replacements:
                  count = text.count(old)
                  if count:
                      totals[label] += count
                      text = text.replace(old, new)
              if text != original:
                  path.write_text(text)

          for label, count in totals.items():
              print(f"{label}: {count}")
              if count < 1:
                  raise SystemExit(f"{label}: no stale assertion found")

          member_link = Path('tests/m325_r2_member_linking_contract.test.mjs')
          replace_required(
              member_link,
              'assert.match(boardingOptions, /boardingStopDisplay\\(stop\\)/);',
              'assert.match(boardingOptions, /formatBerlinTime\\(stop\\.departureAt\\)/);',
              'restore public time formatter contract',
              1
          )

          polish2 = Path('tests/p800_r2_fanbus_polish2.test.mjs')
          replace_required(
              polish2,
              'grid-template-columns:minmax\\(0,1fr\\) 102px',
              'grid-template-columns:104px minmax\\(0,1fr\\)',
              'align Polish 2 mobile time-first grid',
              1
          )
          PY

      - run: npm ci

      - name: Targeted Fanbus tests
        run: node --test tests/p800_r2_fanbus_polish4.test.mjs tests/p800_r2_live_acceptance_fixes.test.mjs tests/p800_r2_fanbus_final_direct_fix.test.mjs

      - name: Full test suite
        shell: bash
        run: |
          set +e
          npm test > /tmp/npm-test.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "=== npm test failure summary ==="
            grep -nE '^not ok|AssertionError|ERR_ASSERTION|failureType:|error:' /tmp/npm-test.log | tail -n 100 || true
            echo "=== tail ==="
            tail -n 180 /tmp/npm-test.log
            exit "$code"
          fi
          tail -n 50 /tmp/npm-test.log

      - name: Static checks
        run: npm run check:static

      - name: JavaScript syntax
        run: node --check js/modules/fanbuses.js && node --check js/fanbus-registration.js && node --check js/pages.js && node --check js/p800-r2-fanbus-ux.js

      - name: Diff check
        run: git diff --check

      - name: Commit clean final fix
        shell: bash
        run: |
          git config user.name "HV9019"
          git config user.email "57114727+HV9019@users.noreply.github.com"
          git rm .github/workflows/p800-final-direct-fix-v2.yml
          git add -u
          git add tests/p800_r2_fanbus_final_direct_fix.test.mjs
          git commit -m "P800-R2: finalize direct Fanbus UX fixes"
          git push origin HEAD:ux/p800-r2-polish4-final-direct-fix-v2
