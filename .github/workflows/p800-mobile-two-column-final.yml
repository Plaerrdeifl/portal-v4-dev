name: P800 final two-column Fanbus mobile fix

on:
  push:
    branches:
      - ux/p800-r2-mobile-editor-two-column-final

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
      - name: Apply only two-column mobile editor correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('js/p800-r2-fanbus-ux.js')
          s = p.read_text()

          old = '    .v4-m310-editor-fields input,.v4-m310-editor-fields select,.v4-m310-trip-stop-editor-row input,.v4-m310-trip-stop-editor-row select,.v4-m310-trip-default-stop select{display:block;box-sizing:border-box;width:100%;min-width:0;max-width:100%;inline-size:100%;min-inline-size:0;max-inline-size:100%}\n'
          new = old + '''    .v4-m310-editor-fields>label:has(>input:is([type="date"],[type="time"],[type="datetime-local"])),.v4-m310-trip-stop-editor-row>label:has(>input[type="time"]){contain:inline-size;overflow:hidden}\n    .v4-m310-trip-editor-form input:is([type="date"],[type="time"],[type="datetime-local"]){-webkit-appearance:none!important;appearance:none!important;box-sizing:border-box!important;display:block!important;width:100%!important;inline-size:100%!important;min-width:0!important;min-inline-size:0!important;max-width:100%!important;max-inline-size:100%!important}\n    .v4-m310-trip-editor-form input:is([type="date"],[type="time"],[type="datetime-local"])::-webkit-date-and-time-value{width:100%!important;min-width:0!important;max-width:100%!important;margin:0!important;padding:0!important;text-align:center!important}\n    .v4-m310-trip-editor-form input:is([type="date"],[type="time"],[type="datetime-local"])::-webkit-datetime-edit{min-width:0!important;max-width:100%!important;padding:0!important}\n'''
          if old not in s:
              raise SystemExit('generic Fanbus input rule not found')
          s = s.replace(old, new, 1)

          replacements = {
              '      .v4-m310-editor-fields{grid-template-columns:1fr}\n': '      .v4-m310-editor-fields{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:8px}\n',
              '      .v4-m310-trip-stop-editor-row{grid-template-columns:1fr}\n': '      .v4-m310-trip-stop-editor-row{grid-template-columns:112px minmax(0,1fr)}\n',
              '      .v4-m310-trip-stop-remove{grid-column:1;justify-self:end}\n': '      .v4-m310-trip-stop-remove{grid-column:1/-1;justify-self:end}\n',
          }
          for a,b in replacements.items():
              if a not in s:
                  raise SystemExit(f'missing UX pattern: {a.strip()}')
              s = s.replace(a,b,1)
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          a = 'p800-r2-fanbus-ux.js?v=20260826-p800-r2-mobile-stack-final'
          b = 'p800-r2-fanbus-ux.js?v=20260826-p800-r2-mobile-two-column-final'
          if a not in s:
              raise SystemExit('index cache key not found')
          p.write_text(s.replace(a,b,1))

          files = [
              Path('tests/p800_r2_fanbus_polish4.test.mjs'),
              Path('tests/p800_r2_fanbus_polish2.test.mjs'),
              Path('tests/p800_r2_live_acceptance_fixes.test.mjs'),
              Path('tests/p800_r2_fanbus_final_direct_fix.test.mjs'),
          ]
          for p in files:
              s = p.read_text()
              s = s.replace(r'\.v4-m310-editor-fields\{grid-template-columns:1fr\}', r'\.v4-m310-editor-fields\{grid-template-columns:repeat\(2,minmax\(0,1fr\)\);column-gap:8px\}')
              s = s.replace(r'\.v4-m310-trip-stop-editor-row\{grid-template-columns:1fr\}', r'\.v4-m310-trip-stop-editor-row\{grid-template-columns:112px minmax\(0,1fr\)\}')
              s = s.replace(r'\.v4-m310-trip-stop-remove\{grid-column:1;justify-self:end\}', r'\.v4-m310-trip-stop-remove\{grid-column:1\/-1;justify-self:end\}')
              s = s.replace(r'v4-m310-editor-fields\{grid-template-columns:1fr', r'v4-m310-editor-fields\{grid-template-columns:repeat\(2,minmax\(0,1fr\)\);column-gap:8px')
              s = s.replace(r'v4-m310-trip-stop-editor-row\{grid-template-columns:1fr', r'v4-m310-trip-stop-editor-row\{grid-template-columns:112px minmax\(0,1fr\)')
              s = s.replace(r'@media \(max-width:620px\)[\s\S]*\.v4-m310-trip-stop-editor-row\{grid-template-columns:1fr\}[\s\S]*\.v4-m310-trip-stop-remove\{grid-column:1;justify-self:end\}', r'@media \(max-width:620px\)[\s\S]*\.v4-m310-trip-stop-editor-row\{grid-template-columns:112px minmax\(0,1fr\)\}[\s\S]*\.v4-m310-trip-stop-remove\{grid-column:1\/-1;justify-self:end\}')
              s = s.replace('p800-r2-mobile-stack-final', 'p800-r2-mobile-two-column-final')
              p.write_text(s)

          p = Path('tests/p800_r2_fanbus_polish4.test.mjs')
          s = p.read_text()
          s = s.replace('  assert.doesNotMatch(desktop, /contain:inline-size/);\n', '  assert.match(desktop, /label:has\\(>input:is\\([^}]+contain:inline-size;overflow:hidden/);\n  assert.match(desktop, /v4-m310-trip-editor-form input:is\\([^}]+-webkit-appearance:none!important;appearance:none!important/);\n')
          p.write_text(s)

          # Remove temporary workflow from the final diff/commit.
          Path('.github/workflows/p800-mobile-two-column-final.yml').unlink()
          PY
      - run: npm ci
      - name: Targeted Fanbus regression tests
        run: node --test tests/p800_r2_fanbus_polish2.test.mjs tests/p800_r2_fanbus_polish4.test.mjs tests/p800_r2_live_acceptance_fixes.test.mjs tests/p800_r2_fanbus_final_direct_fix.test.mjs
      - name: Full test suite
        run: npm test
      - name: Static checks
        run: npm run check:static
      - name: JavaScript syntax
        run: node --check js/p800-r2-fanbus-ux.js
      - name: Diff check
        run: git diff --check
      - name: Commit only corrected two-column mobile layout
        shell: bash
        run: |
          git config user.name "HV9019"
          git config user.email "57114727+HV9019@users.noreply.github.com"
          git add -- js/p800-r2-fanbus-ux.js index.html tests/p800_r2_fanbus_polish2.test.mjs tests/p800_r2_fanbus_polish4.test.mjs tests/p800_r2_live_acceptance_fixes.test.mjs tests/p800_r2_fanbus_final_direct_fix.test.mjs .github/workflows/p800-mobile-two-column-final.yml
          git commit -m "P800-R2: fix two-column Fanbus editor on iPhone"
          git push origin HEAD
