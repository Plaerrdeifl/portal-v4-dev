name: Temporary Liveticker contract patch

on:
  push:
    branches:
      - release/liveticker-r1-clean

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/liveticker-r1-clean
          fetch-depth: 1
      - name: Register Liveticker migrations in core contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/core_contract.test.mjs')
          source = path.read_text()
          old = '''    "20260905123644_fanbus_duplicate_review_indexes_r1.sql"\n  ]);'''
          new = '''    "20260905123644_fanbus_duplicate_review_indexes_r1.sql",\n    "20260905200648_liveticker_prod_r1.sql",\n    "20260905200938_liveticker_prod_rosters_r1.sql"\n  ]);'''
          if old not in source:
              raise SystemExit('expected migration-list anchor not found')
          path.write_text(source.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/core_contract.test.mjs
          git commit -m "test(liveticker): register PROD migrations [contract-fixed]"
          git push origin HEAD:release/liveticker-r1-clean
