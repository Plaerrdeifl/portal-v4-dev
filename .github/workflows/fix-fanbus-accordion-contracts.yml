name: Fix Fanbus accordion contracts

"on":
  push:
    branches:
      - ux/p800-r2-fanbus-accordion
    paths:
      - .github/workflows/fix-fanbus-accordion-contracts.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/p800-r2-fanbus-accordion
      - name: Apply fixes
        run: node scripts/fix-fanbus-accordion-contracts.mjs
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/fix-fanbus-accordion-contracts.yml
      - name: Verify syntax
        run: |
          node --check js/modules/fanbuses.js
          node --check tests/p800_r2_fanbus_accordion.test.mjs
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(p800-r2): preserve Fanbus detail contracts"
          git push origin HEAD:ux/p800-r2-fanbus-accordion
