name: One-time M310 core contract update

on:
  push:
    paths:
      - .github/workflows/one-time-m310-core-contract.yml

permissions:
  contents: write

jobs:
  patch-core-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Register hotfix migration in core contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/core_contract.test.mjs")
          source = path.read_text(encoding="utf-8")
          old = '    "20260831234000_m329_fanbus_contact_management.sql"\n'
          new = (
              '    "20260831234000_m329_fanbus_contact_management.sql",\n'
              '    "20260901133530_hotfix_public_fanbus_homepage_alignment.sql"\n'
          )
          replacement = "".join(new)

          if replacement in source:
              raise SystemExit(0)
          if source.count(old) != 1:
              raise SystemExit("Expected migration anchor exactly once")

          path.write_text(source.replace(old, replacement), encoding="utf-8")
          PY

      - name: Commit exact contract update
        run: |
          if git diff --quiet -- tests/core_contract.test.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/core_contract.test.mjs
          git commit -m "test: register fanbus homepage hotfix migration"
          git push origin HEAD:main
