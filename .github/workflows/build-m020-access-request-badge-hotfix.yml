name: Build M020 access-request badge hotfix

on:
  push:
    branches:
      - fix/m020-access-request-badge
    paths:
      - .github/workflows/build-m020-access-request-badge-hotfix.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m020-access-request-badge
          fetch-depth: 2

      - name: Verify frozen DEV base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5e50ad5800d4f5678c55409a645b330e64e3ac9c"

      - name: Generate scoped hotfix
        shell: bash
        run: |
          set -euo pipefail

          cat > supabase/migrations/20260824222500_m020_access_request_badge_actionability_hotfix.sql <<'SQL'
          create or replace function app_private.notification_projection_actionable(
            p_entity_type text,
            p_entity_id text
          )
          returns boolean
          language plpgsql
          stable
          security definer
          set search_path = ''
          as $function$
          declare
            v_id uuid;
            v_type text := lower(btrim(coalesce(p_entity_type, '')));
          begin
            if v_type = '' then
              return true;
            end if;

            if v_type not in (
              'task',
              'fanbus_registration',
              'fanbus_trip',
              'fanbus_trip_boarding_stop',
              'membership_application',
              'access_request',
              'event',
              'event_import_run'
            ) then
              return true;
            end if;

            begin
              v_id := nullif(btrim(coalesce(p_entity_id, '')), '')::uuid;
            exception when others then
              return false;
            end;

            if v_id is null then
              return false;
            end if;

            if v_type = 'task' then
              return exists(select 1 from app_modules.tasks x where x.id = v_id);
            elsif v_type = 'fanbus_registration' then
              return exists(select 1 from app_modules.fanbus_registrations x where x.id = v_id);
            elsif v_type = 'fanbus_trip' then
              return exists(select 1 from app_modules.fanbus_trips x where x.id = v_id);
            elsif v_type = 'fanbus_trip_boarding_stop' then
              return exists(select 1 from app_modules.fanbus_trip_boarding_stops x where x.id = v_id);
            elsif v_type = 'membership_application' then
              return exists(select 1 from app_fanclub.membership_applications x where x.id = v_id);
            elsif v_type = 'access_request' then
              return exists(
                select 1
                from app_portal.access_requests x
                where x.id = v_id
                  and x.status = 'PENDING'
              );
            elsif v_type = 'event' then
              return exists(select 1 from app_modules.events x where x.id = v_id);
            elsif v_type = 'event_import_run' then
              return exists(select 1 from app_modules.event_import_runs x where x.id = v_id);
            end if;

            return true;
          end;
          $function$;

          comment on function app_private.notification_projection_actionable(text, text) is
          'Returns whether a projected notification still points to an actionable entity. Access requests count as actionable only while PENDING so resolved requests cannot keep unread app badges alive.';
          SQL

          cat > tests/m020_access_request_badge_hotfix.test.mjs <<'JS'
          import assert from "node:assert/strict";
          import fs from "node:fs/promises";
          import path from "node:path";
          import test from "node:test";

          const root = path.resolve(import.meta.dirname, "..");
          const migration = await fs.readFile(
            path.join(
              root,
              "supabase/migrations/20260824222500_m020_access_request_badge_actionability_hotfix.sql"
            ),
            "utf8"
          );

          test("M020 resolved access requests no longer count as actionable unread badges", () => {
            assert.match(
              migration,
              /elsif v_type = 'access_request' then[\s\S]*from app_portal\.access_requests x[\s\S]*where x\.id = v_id[\s\S]*and x\.status = 'PENDING'/
            );
            assert.match(migration, /security definer/);
            assert.match(migration, /set search_path = ''/);
            assert.match(migration, /resolved requests cannot keep unread app badges alive/);
            assert.doesNotMatch(migration, /delete\s+from\s+app_portal\.notifications/i);
            assert.doesNotMatch(migration, /update\s+app_portal\.notifications/i);
          });

          test("M020 hotfix preserves the existing actionability entity allowlist", () => {
            for (const entity of [
              "task",
              "fanbus_registration",
              "fanbus_trip",
              "fanbus_trip_boarding_stop",
              "membership_application",
              "access_request",
              "event",
              "event_import_run"
            ]) {
              assert.ok(migration.includes(`'${entity}'`), `entity missing: ${entity}`);
            }
          });
          JS

          python - <<'PY'
          from pathlib import Path
          path = Path('tests/core_contract.test.mjs')
          source = path.read_text()
          old = '    "20260824044603_m020_access_request_actor_projection_hotfix.sql"\n  ]);'
          new = '    "20260824044603_m020_access_request_actor_projection_hotfix.sql",\n    "20260824222500_m020_access_request_badge_actionability_hotfix.sql"\n  ]);'
          if old not in source:
              raise SystemExit('core contract migration marker not found')
          path.write_text(source.replace(old, new, 1))
          PY

          git rm .github/workflows/build-m020-access-request-badge-hotfix.yml

      - name: Run focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/m020_access_request_badge_hotfix.test.mjs tests/core_contract.test.mjs

      - name: Commit generated hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Plärrdeifl Release Automation"
          git config user.email "release@plaerrdeifl.de"
          git add supabase/migrations/20260824222500_m020_access_request_badge_actionability_hotfix.sql \
                  tests/m020_access_request_badge_hotfix.test.mjs \
                  tests/core_contract.test.mjs \
                  .github/workflows/build-m020-access-request-badge-hotfix.yml
          git commit -m "fix(m020): ignore resolved access requests in badge count"
          git push origin HEAD:fix/m020-access-request-badge
