<section id="m310FanbusPage" class="page module-shell v4-compact-page fanbus-page dates-page">
  <div class="v4-module-surface">
    <div class="v4-heading-row v4-section-heading v4-m310-page-heading">
      <div class="v4-m310-heading-copy">
        <div class="v4-m310-heading-title-row">
          <h3>Fanbusfahrten</h3>
          <div id="m310FanbusManagement" class="v4-action-menu">
            <button
              id="m310FanbusActionToggle"
              class="icon-button v4-action-menu-toggle"
              type="button"
              aria-label="Fanbus-Aktionen öffnen"
              aria-controls="m310FanbusActionMenu"
              aria-expanded="false"
            >⚙️</button>
            <div id="m310FanbusActionMenu" class="v4-action-menu-panel" role="menu" hidden>
              <button id="m325UserFanbusStandardsButton" type="button" role="menuitem">Meine Fanbus-Standards</button>
              <button id="m325CompanionListsButton" type="button" role="menuitem">Meine Mitfahrer</button>
              <button id="m326RegularRidersButton" type="button" role="menuitem" hidden>Stammfahrer</button>
              <button id="m326PersonGroupsButton" type="button" role="menuitem" hidden>Personengruppen</button>
              <button id="m310FanbusSettingsButton" type="button" role="menuitem" hidden>Fanbus-Einstellungen</button>
              <button id="m310AddTripButton" type="button" role="menuitem" hidden>Fanbusfahrt anlegen</button>
            </div>
          </div>
        </div>
        <p>Fahrten entdecken und eigene Buchungen verwalten</p>
      </div>
    </div>
    <div class="module-tabs m327-fanbus-tabs" role="tablist" aria-label="Fanbus-Bereiche">
      <button id="m327TripsTab" class="module-tab active" type="button" role="tab" aria-selected="true" aria-controls="m327TripsPanel">Fahrten</button>
      <button id="m327MyBookingsTab" class="module-tab" type="button" role="tab" aria-selected="false" aria-controls="m327MyBookingsPanel">Meine Buchungen</button>
    </div>
    <section id="m327TripsPanel" role="tabpanel" aria-labelledby="m327TripsTab">
      <div class="v4-heading-row v4-subheading-row">
        <p id="m310FanbusSummary" class="subtle">Fanbusfahrten werden geladen …</p>
        <span id="m310FanbusStatus" class="status-pill">Lädt</span>
      </div>
      <div id="m310FanbusList" class="module-panel" aria-live="polite"></div>
    </section>
    <section id="m327MyBookingsPanel" class="module-panel m327-my-bookings-panel" role="tabpanel" aria-labelledby="m327MyBookingsTab" hidden>
      <div class="v4-heading-row v4-subheading-row">
        <p id="m327MyBookingsSummary" class="subtle">Eigene Buchungen werden bei Bedarf geladen.</p>
        <span id="m327MyBookingsStatus" class="status-pill">Bereit</span>
      </div>
      <div id="m327MyBookingsList" class="m327-my-bookings-list" aria-live="polite"></div>
    </section>
  </div>
</section>
