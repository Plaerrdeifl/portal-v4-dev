  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/icon-32.png">
  <title>Liveticker · Plärrdeifl</title>
  <style>

    *{box-sizing:border-box}html{min-height:100%;-webkit-text-size-adjust:100%}body{min-width:320px;min-height:100%;margin:0;background:linear-gradient(180deg,#e6f1ff 0,#eef2f7 330px);overscroll-behavior-y:none}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}input,select,textarea{font-size:16px;touch-action:manipulation}button,input,select,textarea,label{-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}.visually-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}

history-list{display:grid;gap:6px}.history-empty{margin:0;color:var(--muted);font-size:.8rem}.history-item{border:1px solid var(--line);border-radius:12px;background:#fbfcfe;overflow:hidden}.history-item.major{border-color:#efb2b8;background:#fff7f7}.history-summary{width:100%;min-height:42px;padding:8px 10px;border:0;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;font-size:.79rem;font-weight:900}.history-chevron{color:var(--muted);font-size:.75rem;transition:transform .15s ease}.history-summary[aria-expanded="true"] .history-chevron{transform:rotate(180deg)}.history-details{padding:0 10px 9px;display:grid;gap:7px}.history-details small{color:var(--muted);font-size:.72rem;line-height:1.35}.history-buttons{display:flex;gap:6px}.history-buttons button{min-height:34px;padding:5px 9px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#04233f;font-size:.72rem;font-weight:850}.history-toggle{width:100%;min-height:38px;border:0;background:transparent;color:#0a548f;font-size:.76rem;font-weight:900}.footer-actions{display:flex;justify-content:center}.privacy-note{margin:0 4px;color:var(--muted);font-size:.72rem;line-height:1.45;text-align:center}
    input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,label:focus-visible{outline:3px solid rgba(13,121,232,.28);outline-offset:2px}@media(max-width:440px){.penalty-grid{grid-template-columns:1fr}.live-game-row{grid-template-columns:1fr 1.25fr}.penalty-grid .wide{grid-column:auto}.summary-grid,.graphic-grid{grid-template-columns:1fr}}@media(max-width:360px){.player-entry{grid-template-columns:48px minmax(0,1fr);gap:5px}.jersey-number{width:48px}}@media(min-width:560px){.shell{padding-top:26px}.composer,.output,.history,.summary-actions{padding:19px}.action-grid{grid-template-columns:repeat(3,1fr)}}

<body>
  <noscript>Für den Liveticker muss JavaScript aktiviert sein.</noscript>
  <main id="tickerApp" class="shell" hidden>
    <div class="topline">
      <div class="brand" aria-label="Plärrdeifl Liveticker">
        <img src="../assets/icons/icon-192.png" alt="">
        <span class="brand-copy"><strong>Plärrdeifl</strong><small>LIVETICKER</small></span>
      </div>
      <span class="dev-badge">PROD · INTERN</span>
    </div>

    <section class="card score-card" aria-label="Aktueller Spielstand">
      <div class="status-bar">
        <strong id="segmentLabel">1. Drittel</strong>
        <div class="status-bar-tools">
          <span id="shootoutStatus" class="shootout-status" hidden></span>
          <details id="graphicWorkerControl" class="worker-control" aria-live="polite">
            <summary><span class="worker-indicator"><span id="graphicWorkerDot" class="worker-dot">●</span><span>Grafik</span><strong id="graphicWorkerStatus">…</strong></span></summary>
            <div class="worker-control-body"><button id="graphicWorkerToggle" class="secondary" type="button" disabled>…</button></div>
            <p id="graphicWorkerHint" class="hint" hidden></p>
          </details>
        </div>
      </div>
      <div class="game-meta">
        <div class="field opponent-field" hidden>
          <label class="label" for="opponentSelect">Gegner</label>
          <select id="opponentSelect"></select>
        </div>
        <div class="live-game-row">
          <div class="score-field">
            <span class="live-control-label">Spielstand</span>
            <div class="score-top compact-score" aria-label="Spielstand">
              <div class="team"><span id="mightyScoreName" class="team-name">Heim</span><strong id="mightyScore" class="score">0</strong></div>
              <span class="score-separator">:</span>
              <div class="team"><span id="opponentScoreName" class="team-name">Gast</span><strong id="opponentScore" class="score">0</strong></div>
            </div>
          </div>
          <div class="minute-field">
            <label class="live-control-label" for="gameMinute">Spielminute</label>
            <div class="minute-control">
              <button class="minute-button" type="button" data-minute-step="-1" aria-label="Eine Minute zurück">−</button>
              <input id="gameMinute" class="minute-input" type="number" inputmode="numeric" min="1" step="1" value="1">
              <button class="minute-button" type="button" data-minute-step="1" aria-label="Eine Minute weiter">+</button>
            </div>
          </div>
        </div>
      </div>
      <div id="outputStatusStrip" class="output-status-strip" aria-label="Ausgabestatus">
        <button class="output-status-button" type="button" data-output-status="PERIOD_1" disabled>1. Drittel —</button>
        <button class="output-status-button" type="button" data-output-status="PERIOD_2" disabled>2. Drittel —</button>
        <button class="output-status-button" type="button" data-output-status="FINAL" disabled>Ende —</button>
      </div>
      <section id="graphicsResultPanel" class="summary-actions score-inline-output" hidden>
        <div class="output-head"><h2 id="graphicsResultTitle">Ausgabe</h2><button id="closeGraphicsResults" class="secondary" type="button">Schließen</button></div>
        <p id="inlineGraphicStatus" class="graphic-status" data-state="idle">Status wird geladen …</p>
        <div id="inlineGraphicArtifacts" class="graphic-artifacts" hidden></div>
        <button id="resultGenerateButton" class="secondary" type="button">Neu erstellen</button>
      </section>
      <div class="legacy-output-buttons" aria-hidden="true">
        <button id="period1OutputButton" class="manual-output-button" type="button" disabled>1. Drittel</button>
        <button id="period2OutputButton" class="manual-output-button" type="button" disabled>2. Drittel</button>
        <button id="finalOutputButton" class="manual-output-button" type="button" disabled>Ende</button>
      </div>
      <div id="primaryOutputWrap" class="primary-output-wrap" hidden>
        <button id="primaryOutputButton" class="primary-output-button" type="button" disabled>🏁 1. Drittel ausgeben</button>
      </div>
    </section>

    <form id="tickerForm" class="card composer" novalidate>
      <h2 class="section-title">Aktion</h2>
      <div id="editingBanner" class="editing" hidden><span>Aktion wird bearbeitet</span><button id="cancelEdit" class="secondary" type="button">Abbrechen</button></div>

      <fieldset style="border:0;margin:0;padding:0">
        <legend class="visually-hidden">Aktion auswählen</legend>
        <div class="action-grid">
          <input id="actionGoalMighty" name="action" type="radio" value="GOAL_MIGHTY" checked><label for="actionGoalMighty">🥅<br>Dogs</label>
          <input id="actionPenalty" name="action" type="radio" value="PENALTY"><label for="actionPenalty">🚨<br>Strafe</label>
          <input id="actionGoalOpponent" name="action" type="radio" value="GOAL_OPPONENT"><label id="actionGoalOpponentLabel" for="actionGoalOpponent">🥅<br>Gegner</label>
          <input id="actionShootout" name="action" type="radio" value="SHOOTOUT"><label for="actionShootout">🏒 Penalty-<br>schießen</label>
        </div>
      </fieldset>

      <section id="goalFields" class="goal-fields">
        <div class="field">
          <label id="goalPlayerLabel" class="label" for="goalPlayer">Torschütze Mighty Dogs</label>
          <div class="player-entry"><input id="goalNumber" class="jersey-number" type="text" inputmode="numeric" autocomplete="off" placeholder="#" aria-label="Trikotnummer Torschütze"><select id="goalPlayer"><option value="">Spieler wählen</option></select></div>
        </div>
        <details id="assistDetails" class="assist-details">
          <summary>Assists</summary>
          <div class="assist-grid">
            <div class="field"><label class="label" for="assist1">1. Assist</label><div class="player-entry"><input id="assist1Number" class="jersey-number" type="text" inputmode="numeric" autocomplete="off" placeholder="#" aria-label="Trikotnummer Assist 1"><select id="assist1"><option value="">Kein / noch unbekannt</option></select></div></div>
            <div class="field"><label class="label" for="assist2">2. Assist</label><div class="player-entry"><input id="assist2Number" class="jersey-number" type="text" inputmode="numeric" autocomplete="off" placeholder="#" aria-label="Trikotnummer Assist 2"><select id="assist2"><option value="">Kein / noch unbekannt</option></select></div></div>
          </div>
        </details>
        <fieldset style="border:0;margin:0;padding:0">
          <legend class="label">Textvariante</legend>
          <div class="segmented">
            <input id="styleClassic" name="goalStyle" type="radio" value="classic" checked><label for="styleClassic">Klassisch</label>
            <input id="styleEmotional" name="goalStyle" type="radio" value="emotional"><label for="styleEmotional">Emotional</label>
            <input id="styleShort" name="goalStyle" type="radio" value="short"><label for="styleShort">Kurz</label>
          </div>
        </fieldset>
      </section>

      <section id="penaltyFields" class="penalty-fields" hidden>
        <div id="penaltyRows" class="penalty-list"></div>
        <fieldset style="border:0;margin:0;padding:0">
          <legend class="label">Textvariante</legend>
          <div class="segmented">
            <input id="penaltyStyleClassic" name="penaltyStyle" type="radio" value="classic" checked><label for="penaltyStyleClassic">Klassisch</label>
            <input id="penaltyStyleEmotional" name="penaltyStyle" type="radio" value="emotional"><label for="penaltyStyleEmotional">Emotional</label>
            <input id="penaltyStyleShort" name="penaltyStyle" type="radio" value="short"><label for="penaltyStyleShort">Kurz</label>
          </div>
        </fieldset>
      </section>

      <section id="shootoutFields" class="shootout-fields" hidden>
        <div class="field">
          <label class="label" for="shootoutTeam">Mannschaft</label>
          <select id="shootoutTeam"><option value="mighty">Mighty Dogs</option><option value="opponent">Gegner</option></select>
        </div>
        <div class="field">
          <label class="label" for="shootoutPlayer">Schütze</label>
          <div class="player-entry"><input id="shootoutNumber" class="jersey-number" type="text" inputmode="numeric" autocomplete="off" placeholder="#" aria-label="Trikotnummer Penaltyschütze"><select id="shootoutPlayer"><option value="">Schütze noch unbekannt</option></select></div>
        </div>
        <fieldset style="border:0;margin:0;padding:0">
          <legend class="label">Ergebnis</legend>
          <div class="segmented">
            <input id="shootoutScored" name="shootoutResult" type="radio" value="scored" checked><label for="shootoutScored">✅ Verwandelt</label>
            <input id="shootoutMissed" name="shootoutResult" type="radio" value="missed"><label for="shootoutMissed">❌ Vergeben</label>
          </div>
        </fieldset>
      </section>

      <p id="formError" class="error" role="alert" hidden></p>
      <button id="submitButton" class="primary submit-compact" type="submit" aria-label="Speichern und kopieren" title="Speichern und kopieren"><span aria-hidden="true">💾 📋</span><span class="visually-hidden">Speichern und kopieren</span></button>
    </form>

    <section id="whatsappOutput" class="card output" aria-labelledby="outputTitle" hidden>
      <div class="output-head"><h2 id="outputTitle">WhatsApp</h2><span id="outputCopyState" class="copy-state"></span></div>
      <div id="tickerOutputPreview" class="output-preview"></div>
      <textarea id="tickerOutput" spellcheck="true" hidden></textarea>
      <div class="output-actions">
        <button id="editOutputButton" class="secondary output-icon" type="button" aria-label="Text bearbeiten" title="Bearbeiten">✏️</button>
        <button id="saveOutputButton" class="primary output-icon" type="button" hidden aria-label="Speichern und kopieren" title="Speichern und kopieren">💾 📋</button>
        <button id="copyButton" class="copy-button output-icon" type="button" hidden aria-label="Kopieren" title="Kopieren">📋</button>
      </div>
    </section>

    <section class="card history">
      <h2>Letzte Ereignisse</h2>
      <p id="historyEmpty" class="history-empty">Noch keine Aktion erfasst.</p>
      <div id="historyList" class="history-list"></div>
      <button id="historyToggle" class="history-toggle" type="button" hidden>Alle Ereignisse anzeigen ▾</button>
    </section>

    <div class="footer-actions"><button id="resetGame" class="secondary danger" type="button">Testspiel zurücksetzen</button></div>
  </main>
  <script src="../js/runtime-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.7"></script>
  <script type="module" src="../js/liveticker-auth-bootstrap.js?v=20260910-live-ux5"></script>
</body>
</html>
